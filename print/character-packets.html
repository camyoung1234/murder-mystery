    function renderSheets() {
      const container = document.getElementById("sheetsContainer");
      container.innerHTML = SHEETS.map(s => `
        <div class="sheet" data-id="${s.id}">
          <div>
            <div class="sheet-header">
              <div>
                <div class="game-kicker">The Last Chime of Ravenshollow &bull; Character #${s.id}</div>
                <div class="char-title">${s.name}</div>
                <div class="char-subtitle">${s.role}</div>
              </div>
              <div class="alignment-box ${s.badgeClass}">${s.badge}</div>
            </div>

            ${s.special ? `<div class="special-callout"><strong>SECRET ROLE:</strong> ${s.special}</div>` : ""}

            <div class="section">
              <div class="section-title">Who You Are</div>
              <p>${s.persona}</p>
            </div>

            <div class="section">
              <div class="section-title">Your Secret</div>
              <p>${s.secret}</p>
            </div>

            <div class="section">
              <div class="section-title">Crucial Knowledge</div>
              <p>${s.clue}</p>
            </div>

            <div class="section">
              <div class="section-title">Mandatory Dialogues (Check Off Each Act — Fast 5–7 Min Mingles!)</div>
              <div class="dialogue-box">
                ${s.dialogues.map(d => `
                  <div class="dialogue-item">
                    <div class="checkbox"></div>
                    <div><span class="act-pill">${d.act}</span><strong>${d.target}</strong> ${d.line}</div>
                  </div>
                `).join("")}
              </div>
            </div>

            <div class="rules-strip">
              <strong>30–45 Min Pacing:</strong> Act I (7m mingle + 3m vote + 1m blackout) &rarr; Act II (6m + 3m + 1m) &rarr; Act III (5m + Final Verdict). If you are <strong>Detained</strong> in Town Hall, you stay in the game—open &amp; read your Detention Card below, and skip your next Town Hall vote.
            </div>
          </div>

          <div class="detention-wrapper">
            <div class="cut-line">&#9986; HOST: FOLD UP &amp; TAPE SHUT (OR CUT &amp; ENVELOPE) — DO NOT OPEN UNLESS DETAINED OR INSPECTED &#9986;</div>
            <div class="detention-card">
              <div class="detention-header">
                <span>SEALED DETENTION CARD &bull; #${s.id} ${s.name}</span>
                <span>OPEN ONLY IF DETAINED</span>
              </div>
              <p>${s.detention}</p>
            </div>
          </div>
        </div>
      `).join("");
    }

    function setCount(val) {
      const n = parseInt(val, 10);
      document.getElementById("countVal").textContent = n;
      document.getElementById("btnCount").textContent = n;
      document.querySelectorAll(".sheet").forEach(el => {
        const id = parseInt(el.dataset.id, 10);
        el.classList.toggle("hidden", id > n);
      });
    }

    renderSheets();
