<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Printable Character Sheets (1–20) — The Last Chime of Ravenshollow</title>
  <script src="../assets/mystery-engine.js"></script>
  <style>
    @page { size: letter portrait; margin: 0.4in 0.45in; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      color: #111;
      background: #e9e9e9;
      line-height: 1.38;
    }

    /* Screen-only print control bar */
    .toolbar {
      background: #141821;
      color: #f4ebd8;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 2px solid #d4a853;
    }
    .toolbar h1 { font-size: 1.02rem; color: #d4a853; }
    .toolbar p { font-size: 0.8rem; color: #b5bcc9; }
    .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .code-input {
      background: #0b0d12;
      color: #d4a853;
      border: 1.5px solid #d4a853;
      padding: 6px 10px;
      border-radius: 5px;
      font-family: "Courier New", monospace;
      font-weight: 700;
      width: 104px;
      text-align: center;
      font-size: 0.92rem;
    }
    .btn {
      background: #232a3a;
      color: #f4ebd8;
      border: 1px solid #3c465c;
      padding: 7px 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.84rem;
      text-decoration: none;
    }
    .btn:hover { border-color: #d4a853; color: #d4a853; }
    .print-btn {
      background: #d4a853;
      color: #111;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.88rem;
    }
    .print-btn:hover { filter: brightness(1.08); }

    /* One US Letter Page per Character */
    .sheet {
      width: 8.5in;
      height: 10.2in;
      background: #fff;
      margin: 18px auto;
      padding: 0.35in 0.45in;
      box-shadow: 0 4px 16px rgba(0,0,0,0.16);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      page-break-after: always;
      break-after: page;
    }
    .sheet.hidden { display: none !important; }
    .sheet:last-of-type { page-break-after: auto; break-after: auto; }

    /* Blind-print privacy shield on screen (optional toggle) */
    .privacy-shield .sheet { filter: blur(8px); user-select: none; }

    .sheet-header {
      border-bottom: 2.5px solid #111;
      padding-bottom: 7px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
    }
    .game-kicker {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #555;
    }
    .char-title { font-size: 1.5rem; font-weight: 700; margin-top: 2px; }
    .char-subtitle { font-size: 0.92rem; font-style: italic; color: #333; }
    .alignment-box {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border: 2px solid #111;
      padding: 4px 10px;
      text-align: center;
      white-space: nowrap;
    }
    .alignment-box.shadow { background: #111; color: #fff; }
    .alignment-box.inspector { border-style: double; border-width: 4px; }

    .section { margin-bottom: 9px; }
    .section-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.11em;
      color: #222;
      border-bottom: 1px solid #bbb;
      padding-bottom: 2px;
      margin-bottom: 5px;
    }
    .section p { font-size: 0.87rem; margin-bottom: 4px; }

    .special-callout {
      border: 1.5px solid #111;
      background: #f5f5f5;
      padding: 7px 10px;
      font-size: 0.83rem;
      margin-bottom: 9px;
    }

    .dialogue-box {
      border: 1.5px solid #222;
      padding: 8px 10px;
      border-radius: 3px;
      margin-bottom: 8px;
    }
    .dialogue-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 0.84rem;
    }
    .dialogue-item:last-child { margin-bottom: 0; }
    .checkbox {
      width: 13px;
      height: 13px;
      border: 1.5px solid #111;
      flex-shrink: 0;
      margin-top: 3px;
    }
    .act-pill {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      background: #222;
      color: #fff;
      padding: 1px 5px;
      margin-right: 4px;
    }

    .rules-strip {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.72rem;
      color: #333;
      background: #f7f7f7;
      border: 1px solid #ccc;
      padding: 5px 8px;
      margin-bottom: 8px;
    }

    .detention-wrapper { margin-top: auto; }
    .cut-line {
      border-top: 1.5px dashed #333;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      color: #444;
      padding-top: 3px;
      margin-bottom: 6px;
    }
    .detention-card { border: 2px solid #111; padding: 9px 12px; background: #fafafa; }
    .detention-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-bottom: 1px solid #999;
      padding-bottom: 4px;
      margin-bottom: 6px;
    }
    .detention-card p { font-size: 0.84rem; }

    @media print {
      body { background: #fff; }
      .toolbar { display: none !important; }
      .privacy-shield .sheet { filter: none !important; }
      .sheet { width: auto; height: 10.1in; margin: 0; padding: 0; box-shadow: none; }
    }
  </style>
</head>
<body class="privacy-shield" id="bodyEl">

  <div class="toolbar">
    <div>
      <h1>Printable Character Sheets — Dynamic 20-Killer Edition (30–45 Min)</h1>
      <p>Sheets are blurred on screen so you can roll &amp; print completely blind! (Prints crystal-clear.)</p>
    </div>
    <div class="controls">
      <label style="font-size:0.85rem;">Players:</label>
      <input type="range" id="countSlider" min="8" max="20" value="8" oninput="updateConfig()" />
      <strong id="countVal" style="color:#d4a853; font-size:1.1rem; min-width:24px;">8</strong>

      <label style="font-size:0.85rem; margin-left:4px;">Case:</label>
      <input type="text" id="caseCodeInput" class="code-input" value="" onchange="applyManualCode()" />
      <button class="btn" onclick="rollNewCase()" title="Picks any character #1-#N randomly as Killer (hidden in the code)">Roll Random Killer</button>
      <button class="btn" id="blurBtn" onclick="toggleBlur()">Unblur Preview</button>
      <a class="btn" id="evidenceLink" href="evidence-cards-stylized.html" target="_blank">Stylized Evidence</a>
      <a class="btn" id="hostGuideLink" href="host-guide.html" target="_blank">Host Guide</a>
      <a class="btn" id="companionLink" href="../companion/index.html" target="_blank">Companion App</a>
      <button class="print-btn" onclick="window.print()">Print <span id="btnCount">8</span> Sheets</button>
    </div>
  </div>

  <div id="sheetsContainer"></div>

  <script>
    const E = window.RavenshollowEngine;
    const params = new URLSearchParams(window.location.search);
    let playerCount = parseInt(params.get("players") || localStorage.getItem("ravenshollow_players") || "8", 10);
    let caseCode = params.get("case") || localStorage.getItem("ravenshollow_case_code") || E.CLASSIC_CODE;

    document.getElementById("countSlider").value = playerCount;
    document.getElementById("caseCodeInput").value = caseCode;

    function toggleBlur() {
      const b = document.getElementById("bodyEl");
      if (b.classList.contains("privacy-shield")) {
        if (!confirm("Unblurring will show character roles on screen (possible spoilers!). Continue?")) return;
        b.classList.remove("privacy-shield");
        document.getElementById("blurBtn").textContent = "Blur (Spoiler-Free)";
      } else {
        b.classList.add("privacy-shield");
        document.getElementById("blurBtn").textContent = "Unblur Preview";
      }
    }

    function rollNewCase() {
      playerCount = parseInt(document.getElementById("countSlider").value, 10);
      caseCode = E.rollRandomCase(playerCount);
      document.getElementById("caseCodeInput").value = caseCode;
      saveAndRender();
    }

    function applyManualCode() {
      const dec = E.decodeCaseCode(document.getElementById("caseCodeInput").value);
      caseCode = dec.code;
      document.getElementById("caseCodeInput").value = caseCode;
      saveAndRender();
    }

    function updateConfig() {
      playerCount = parseInt(document.getElementById("countSlider").value, 10);
      saveAndRender();
    }

    function saveAndRender() {
      localStorage.setItem("ravenshollow_case_code", caseCode);
      localStorage.setItem("ravenshollow_players", String(playerCount));
      document.getElementById("countVal").textContent = playerCount;
      document.getElementById("btnCount").textContent = playerCount;
      const q = `?case=${encodeURIComponent(caseCode)}&players=${playerCount}`;
      document.getElementById("evidenceLink").href = "evidence-cards-stylized.html" + q;
      document.getElementById("hostGuideLink").href = "host-guide.html" + q;
      document.getElementById("companionLink").href = "../companion/index.html" + q;

      const scenario = E.buildScenario(caseCode, playerCount);
      const container = document.getElementById("sheetsContainer");
      container.innerHTML = scenario.characters.map(s => `
        <div class="sheet ${s.id > playerCount ? "hidden" : ""}" data-id="${s.id}">
          <div>
            <div class="sheet-header">
              <div>
                <div class="game-kicker">The Last Chime of Ravenshollow &bull; Case ${scenario.code} &bull; Character #${s.id}</div>
                <div class="char-title">${s.name}</div>
                <div class="char-subtitle">${s.role}</div>
              </div>
              <div class="alignment-box ${s.badgeClass}">${s.badge}</div>
            </div>

            ${s.special ? `<div class="special-callout"><strong>SECRET ROLE:</strong> ${s.special}</div>` : ""}

            <div class="section">
              <div class="section-title">Who You Are</div>
              <p>${s.persona}</p>
            </div>

            <div class="section">
              <div class="section-title">Your Secret</div>
              <p>${s.secret}</p>
            </div>

            <div class="section">
              <div class="section-title">Crucial Knowledge</div>
              <p>${s.clue}</p>
            </div>

            <div class="section">
              <div class="section-title">Mandatory Dialogues (Check Off Each Act — Fast 5–7 Min Mingles!)</div>
              <div class="dialogue-box">
                ${s.dialogues.map(d => `
                  <div class="dialogue-item">
                    <div class="checkbox"></div>
                    <div><span class="act-pill">${d.act}</span><strong>${d.target}</strong> ${d.line}</div>
                  </div>
                `).join("")}
              </div>
            </div>

            <div class="rules-strip">
              <strong>30–45 Min Pacing:</strong> Act I (7m mingle + 3m vote + 1m blackout) &rarr; Act II (6m + 3m + 1m) &rarr; Act III (7m + Final Verdict). If <strong>Detained</strong> in Town Hall, you stay in the game—open &amp; read your Detention Card below and skip your next Town Hall vote &amp; Blackout action. If <strong>Shaken</strong> during a Blackout, you cannot vote in the next Town Hall (everyone votes in the Final Verdict).
            </div>
          </div>

          <div class="detention-wrapper">
            <div class="cut-line">&#9986; FOLD UP &amp; TAPE SHUT (OR CUT &amp; ENVELOPE) — DO NOT OPEN UNLESS DETAINED OR INSPECTED &#9986;</div>
            <div class="detention-card">
              <div class="detention-header">
                <span>SEALED DETENTION CARD &bull; #${s.id} ${s.name}</span>
                <span>CASE ${scenario.code}</span>
              </div>
              <p>${s.detention}</p>
            </div>
          </div>
        </div>
      `).join("");
    }

    saveAndRender();
  </script>
</body>
</html>
