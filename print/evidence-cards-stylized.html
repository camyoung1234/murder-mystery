<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stylized Evidence Packet — The Last Chime of Ravenshollow</title>
  <script src="../assets/variations-data.js"></script>
  <script src="../assets/mystery-engine.js?v=20261121"></script>
  <style>
    @page { size: letter portrait; margin: 0.4in; }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    body {
      font-family: Georgia, "Times New Roman", serif;
      color: #231b12;
      background: #14171f;
      line-height: 1.45;
    }

    .toolbar {
      background: #0e1118;
      color: #f4ebd8;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 2px solid #c99c46;
    }
    .toolbar h1 { font-size: 1.02rem; color: #d4a853; }
    .toolbar p { font-size: 0.8rem; color: #aeb6c4; }
    .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .code-input {
      background: #0b0d12;
      color: #d4a853;
      border: 1.5px solid #d4a853;
      padding: 6px 10px;
      border-radius: 5px;
      font-family: "Courier New", monospace;
      font-weight: 700;
      width: 104px;
      text-align: center;
      font-size: 0.92rem;
    }
    .btn {
      background: #232a3a;
      color: #f4ebd8;
      border: 1px solid #3c465c;
      padding: 7px 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.84rem;
    }
    .btn:hover { border-color: #d4a853; color: #d4a853; }
    .print-btn {
      background: linear-gradient(135deg, #d4a853, #a87e2e);
      color: #111;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.88rem;
    }

    .privacy-shield .secret-page { filter: blur(8px); user-select: none; }

    .page {
      width: 8.5in;
      min-height: 10.2in;
      background:
        radial-gradient(circle at top left, rgba(201, 156, 70, 0.14), transparent 45%),
        radial-gradient(circle at bottom right, rgba(138, 92, 42, 0.14), transparent 45%),
        #f7efe0;
      margin: 22px auto;
      padding: 0.42in 0.5in;
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.5);
      border: 1px solid #cbb68e;
      display: flex;
      flex-direction: column;
      gap: 16px;
      page-break-after: always;
      break-after: page;
    }
    .page:last-child { page-break-after: auto; break-after: auto; }

    .ornate-header {
      text-align: center;
      border-top: 3px double #7d5b24;
      border-bottom: 3px double #7d5b24;
      padding: 8px 12px;
      background: rgba(201, 156, 70, 0.08);
    }
    .ornate-header .kicker {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #6b4c1c;
      font-weight: 700;
    }
    .ornate-header h2 { font-size: 1.45rem; color: #2b1d0e; margin-top: 2px; }

    .map-frame {
      border: 3px solid #6b4c1c;
      padding: 6px;
      background: #efe3cb;
    }
    .map-frame img { display: block; width: 100%; height: auto; border: 1px solid #8a6830; }

    .exhibit-card {
      border: 2px solid #6b4c1c;
      outline: 1px solid #c5a365;
      outline-offset: -6px;
      background: linear-gradient(180deg, #fcf7ec 0%, #f3e7d0 100%);
      padding: 20px 22px;
      position: relative;
      flex: 1;
    }
    .wax-seal {
      position: absolute;
      top: 14px;
      right: 16px;
      background: radial-gradient(circle at 35% 35%, #b83232, #731616);
      color: #f9ebd2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 6px 11px;
      border-radius: 999px;
      border: 2px solid #520d0d;
    }
    .exhibit-kicker {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #822222;
      margin-bottom: 4px;
    }
    .exhibit-card h3 {
      font-size: 1.2rem;
      color: #24180c;
      border-bottom: 1.5px solid #bfa16a;
      padding-bottom: 6px;
      margin-bottom: 10px;
      padding-right: 110px;
    }
    .exhibit-card ul { margin-left: 18px; font-size: 0.94rem; }
    .exhibit-card li { margin-bottom: 7px; }
    .exhibit-card pre {
      font-family: "Courier New", monospace;
      font-size: 0.85rem;
      line-height: 1.48;
      background: radial-gradient(circle at bottom right, rgba(35, 22, 12, 0.3), transparent 55%), #efe4cc;
      border: 1.5px dashed #4a3319;
      padding: 14px 16px;
      white-space: pre-wrap;
      margin-top: 8px;
    }
    .cut-line {
      border-top: 1.5px dashed #7d5b24;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      color: #6b4c1c;
      padding-top: 3px;
    }

    @media print {
      body { background: #fff; }
      .toolbar { display: none !important; }
      .privacy-shield .secret-page { filter: none !important; }
      .page { width: auto; min-height: 10.1in; margin: 0; box-shadow: none; border: none; }
    }
  </style>
</head>
<body class="privacy-shield" id="bodyEl">

  <div class="toolbar">
    <div>
      <h1>Stylized Evidence Packet — Synced to Case Code</h1>
      <p>Map is visible; Exhibits A–F are blurred on screen so you can print blind! (Prints crystal-clear.)</p>
    </div>
    <div class="controls">
      <label style="font-size:0.85rem;">Case:</label>
      <input type="text" id="caseCodeInput" class="code-input" onchange="applyCode()" />
      <button class="btn" id="blurBtn" onclick="toggleBlur()">Unblur Exhibits</button>
      <button class="print-btn" onclick="window.print()">Print Stylized Evidence (5 Pages)</button>
    </div>
  </div>

  <div id="pagesContainer"></div>

  <script>
    const E = window.RavenshollowEngine;
    const params = new URLSearchParams(window.location.search);
    const playerCount = parseInt(params.get("players") || localStorage.getItem("ravenshollow_players") || "8", 10);
    let caseCode = params.get("case") || localStorage.getItem("ravenshollow_case_code") || E.CLASSIC_CODE;
    document.getElementById("caseCodeInput").value = caseCode;

    function toggleBlur() {
      const b = document.getElementById("bodyEl");
      b.classList.toggle("privacy-shield");
      document.getElementById("blurBtn").textContent = b.classList.contains("privacy-shield") ? "Unblur Exhibits" : "Blur (Spoiler-Free)";
    }

    function applyCode() {
      const dec = E.decodeCaseCode(document.getElementById("caseCodeInput").value);
      caseCode = dec.code;
      document.getElementById("caseCodeInput").value = caseCode;
      localStorage.setItem("ravenshollow_case_code", caseCode);
      render();
    }

    function render() {
      const sc = E.buildScenario(caseCode, playerCount);
      const byId = id => sc.exhibits.find(x => x.id === id);

      document.getElementById("pagesContainer").innerHTML = `
        <div class="page">
          <div class="ornate-header">
            <div class="kicker">The Last Chime of Ravenshollow &bull; Case ${sc.code} &bull; Public Board</div>
            <h2>Ravenshollow Manor — Estate Floorplan</h2>
          </div>
          <div class="map-frame">
            <img src="../assets/ravenshollow-manor-map.jpg" alt="Ravenshollow Manor Floorplan" />
          </div>
          <div class="exhibit-card" style="flex:0 0 auto; padding:14px 18px;">
            <div class="wax-seal">Public Record</div>
            <div class="exhibit-kicker">Always Visible &bull; November 19</div>
            <h3 style="font-size:1.08rem; margin-bottom:7px;">Known Sequence of Events</h3>
            <ul style="font-size:0.86rem;">
              <li><strong>8:45 PM:</strong> Lord Arthur Vance retires alone to his second-floor Study to fetch his unsigned <strong>New Will</strong>, bolting the heavy oak door from the <strong>inside</strong>.</li>
              <li><strong>8:55 PM:</strong> Guests in the Grand Hall hear Arthur shouting from upstairs: <em>"You've gone too far! I'm calling the police as soon as the lines are back!"</em></li>
              <li><strong>9:00 PM Sharp:</strong> As the Grand Astronomical Clock chimes nine, the backup generator dies—<strong>total darkness for 15 seconds</strong>. A sharp crack and heavy thud echo from the Study.</li>
              <li><strong>9:01 PM:</strong> Lights return. Guests break down the bolted Study door and find Lord Arthur Vance <strong>dead at his desk</strong>.</li>
            </ul>
          </div>
        </div>

        <div class="page secret-page">
          <div class="ornate-header">
            <div class="kicker">Case ${sc.code} &bull; Unseal at Start of Act I</div>
            <h2>Act I Evidence — The Locked Study</h2>
          </div>
          <div class="exhibit-card"><div class="wax-seal">Exhibit A</div><div class="exhibit-kicker">Act I</div><h3>${byId("A").title}</h3>${byId("A").html}</div>
          <div class="cut-line">&#9986; CUT HERE IF DISPLAYING SEPARATELY &#9986;</div>
          <div class="exhibit-card"><div class="wax-seal">Exhibit B</div><div class="exhibit-kicker">Act I</div><h3>${byId("B").title}</h3>${byId("B").html}</div>
        </div>

        <div class="page secret-page">
          <div class="ornate-header">
            <div class="kicker">Case ${sc.code} &bull; Unseal at Start of Act II</div>
            <h2>Act II Evidence — Shadows in the Clockwork</h2>
          </div>
          <div class="exhibit-card"><div class="wax-seal">Exhibit C</div><div class="exhibit-kicker">Act II</div><h3>${byId("C").title}</h3>${byId("C").html}</div>
          <div class="cut-line">&#9986; CUT HERE IF DISPLAYING SEPARATELY &#9986;</div>
          <div class="exhibit-card"><div class="wax-seal">Exhibit D</div><div class="exhibit-kicker">Act II</div><h3>${byId("D").title}</h3>${byId("D").html}</div>
        </div>

        <div class="page secret-page">
          <div class="ornate-header">
            <div class="kicker">Case ${sc.code} &bull; Unseal at Start of Act III</div>
            <h2>Act III Evidence — The Last Chime</h2>
          </div>
          <div class="exhibit-card"><div class="wax-seal">Exhibit E</div><div class="exhibit-kicker">Act III</div><h3>${byId("E").title}</h3>${byId("E").html}</div>
          <div class="cut-line">&#9986; CUT HERE IF DISPLAYING SEPARATELY &#9986;</div>
          <div class="exhibit-card"><div class="wax-seal">Exhibit F</div><div class="exhibit-kicker">Act III</div><h3>${byId("F").title}</h3>${byId("F").html}</div>
        </div>

        <div class="page secret-page">
          <div class="ornate-header">
            <div class="kicker">Case ${sc.code} &bull; Place on Board in Act II (FL1) &amp; Act III (FL2)</div>
            <h2>Act II &amp; III False Lead Slips</h2>
          </div>
          <div class="exhibit-card"><div class="wax-seal">False Lead #1</div><div class="exhibit-kicker">Unveil in Act II</div><h3>${byId("FL1").title}</h3>${byId("FL1").html}</div>
          <div class="cut-line">&#9986; CUT HERE &#9986;</div>
          <div class="exhibit-card"><div class="wax-seal">False Lead #2</div><div class="exhibit-kicker">Unveil in Act III</div><h3>${byId("FL2").title}</h3>${byId("FL2").html}</div>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
