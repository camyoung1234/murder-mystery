<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Complete Game Packet (Single PDF) — The Last Chime of Ravenshollow</title>
  <script src="../assets/variations-data.js"></script>
  <script src="../assets/mystery-engine.js"></script>
  <style>
    @page { size: letter portrait; margin: 0.4in 0.45in; }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    body {
      font-family: Georgia, "Times New Roman", serif;
      color: #111;
      background: #1a1e29;
      line-height: 1.4;
    }

    /* Screen-only unified toolbar */
    .toolbar {
      background: #0e1118;
      color: #f4ebd8;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 2px solid #d4a853;
    }
    .toolbar h1 { font-size: 1.02rem; color: #d4a853; }
    .toolbar p { font-size: 0.8rem; color: #b5bcc9; }
    .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .code-input {
      background: #0b0d12;
      color: #d4a853;
      border: 1.5px solid #d4a853;
      padding: 6px 10px;
      border-radius: 5px;
      font-family: "Courier New", monospace;
      font-weight: 700;
      width: 104px;
      text-align: center;
      font-size: 0.92rem;
    }
    .select-input {
      background: #232a3a;
      color: #f4ebd8;
      border: 1px solid #3c465c;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
    }
    .toggle-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: #f4ebd8;
      background: #232a3a;
      border: 1px solid #3c465c;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
    }
    .btn {
      background: #232a3a;
      color: #f4ebd8;
      border: 1px solid #3c465c;
      padding: 7px 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.84rem;
      text-decoration: none;
    }
    .btn:hover { border-color: #d4a853; color: #d4a853; }
    .print-btn {
      background: linear-gradient(135deg, #d4a853, #b58932);
      color: #111;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.88rem;
    }
    .print-btn:hover { filter: brightness(1.08); }

    /* Screen-only section banners */
    .screen-divider {
      max-width: 8.5in;
      margin: 24px auto 8px;
      padding: 10px 16px;
      background: #0e1118;
      color: #d4a853;
      border-left: 4px solid #d4a853;
      border-radius: 4px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.86rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .screen-divider span.sub {
      font-weight: 400;
      font-size: 0.78rem;
      color: #b5bcc9;
      text-transform: none;
      letter-spacing: normal;
    }

    /* Privacy shield on screen */
    .privacy-shield .spoiler-content { filter: blur(8px); user-select: none; }

    /* =====================================================================
       PART 1: CHARACTER SHEETS (1 US Letter page per character)
       ===================================================================== */
    .sheet {
      width: 8.5in;
      height: 10.2in;
      background: #fff;
      margin: 18px auto;
      padding: 0.35in 0.45in;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      page-break-after: always;
      break-after: page;
      line-height: 1.38;
    }
    .sheet-header {
      border-bottom: 2.5px solid #111;
      padding-bottom: 7px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
    }
    .game-kicker {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #555;
    }
    .char-title { font-size: 1.5rem; font-weight: 700; margin-top: 2px; }
    .char-subtitle { font-size: 0.92rem; font-style: italic; color: #333; }
    .fold-role-wrapper {
      margin-bottom: 8px;
    }
    .fold-role-box {
      border: 1.5px solid #111;
      background: #fafafa;
      padding: 7px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .fold-role-text {
      font-size: 0.81rem;
      line-height: 1.32;
      flex: 1;
    }
    .alignment-box {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border: 1.5px solid #111;
      background: #fff;
      color: #111;
      padding: 5px 10px;
      text-align: center;
      white-space: nowrap;
      min-width: 215px;
      flex-shrink: 0;
    }
    .fold-line {
      border-bottom: 1.5px dashed #333;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.66rem;
      letter-spacing: 0.1em;
      color: #444;
      padding: 4px 0 3px;
      margin-bottom: 8px;
    }

    .section { margin-bottom: 9px; }
    .section-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.11em;
      color: #222;
      border-bottom: 1px solid #bbb;
      padding-bottom: 2px;
      margin-bottom: 5px;
    }
    .section p { font-size: 0.87rem; margin-bottom: 4px; }
    .special-callout {
      border: 1.5px solid #111;
      background: #f5f5f5;
      padding: 7px 10px;
      font-size: 0.83rem;
      margin-bottom: 9px;
    }
    .dialogue-box {
      border: 1.5px solid #222;
      padding: 8px 10px;
      border-radius: 3px;
      margin-bottom: 8px;
    }
    .dialogue-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 0.84rem;
    }
    .dialogue-item:last-child { margin-bottom: 0; }
    .checkbox {
      width: 13px;
      height: 13px;
      border: 1.5px solid #111;
      flex-shrink: 0;
      margin-top: 3px;
    }
    .act-pill {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      background: #222;
      color: #fff;
      padding: 1px 5px;
      margin-right: 4px;
    }
    .rules-strip {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.72rem;
      color: #333;
      background: #f7f7f7;
      border: 1px solid #ccc;
      padding: 5px 8px;
      margin-bottom: 8px;
    }
    .detention-wrapper { margin-top: auto; }
    .cut-line {
      border-top: 1.5px dashed #333;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      color: #444;
      padding-top: 3px;
      margin-bottom: 6px;
    }
    .sealed-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 8px;
    }
    .detention-card { border: 2px solid #111; padding: 8px 10px; background: #fafafa; }
    .detention-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-bottom: 1px solid #999;
      padding-bottom: 3px;
      margin-bottom: 5px;
    }
    .detention-card p { font-size: 0.78rem; line-height: 1.32; }

    /* =====================================================================
       PART 2: EVIDENCE PACKET (Stylized Color OR Ink-Friendly B&W)
       ===================================================================== */
    .ev-page {
      width: 8.5in;
      min-height: 10.2in;
      margin: 18px auto;
      padding: 0.42in 0.5in;
      box-shadow: 0 4px 18px rgba(0,0,0,0.35);
      display: flex;
      flex-direction: column;
      gap: 16px;
      page-break-after: always;
      break-after: page;
      line-height: 1.45;
    }

    /* Stylized Parchment Mode */
    .evidence-stylized .ev-page {
      color: #231b12;
      background:
        radial-gradient(circle at top left, rgba(201, 156, 70, 0.14), transparent 45%),
        radial-gradient(circle at bottom right, rgba(138, 92, 42, 0.14), transparent 45%),
        #f7efe0;
      border: 1px solid #cbb68e;
    }
    .ornate-header {
      text-align: center;
      border-top: 3px double #7d5b24;
      border-bottom: 3px double #7d5b24;
      padding: 8px 12px;
      background: rgba(201, 156, 70, 0.08);
    }
    .ornate-header .kicker {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #6b4c1c;
      font-weight: 700;
    }
    .ornate-header h2 { font-size: 1.45rem; color: #2b1d0e; margin-top: 2px; border: none; padding: 0; }
    .map-frame {
      border: 3px solid #6b4c1c;
      padding: 6px;
      background: #efe3cb;
    }
    .map-frame img { display: block; width: 100%; height: auto; border: 1px solid #8a6830; }
    .exhibit-card {
      border: 2px solid #6b4c1c;
      outline: 1px solid #c5a365;
      outline-offset: -6px;
      background: linear-gradient(180deg, #fcf7ec 0%, #f3e7d0 100%);
      padding: 20px 22px;
      position: relative;
      flex: 1;
    }
    .wax-seal {
      position: absolute;
      top: 14px;
      right: 16px;
      background: radial-gradient(circle at 35% 35%, #b83232, #731616);
      color: #f9ebd2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 6px 11px;
      border-radius: 999px;
      border: 2px solid #520d0d;
    }
    .exhibit-kicker {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #822222;
      margin-bottom: 4px;
    }
    .exhibit-card h3 {
      font-size: 1.2rem;
      color: #24180c;
      border-bottom: 1.5px solid #bfa16a;
      padding-bottom: 6px;
      margin-bottom: 10px;
      padding-right: 110px;
    }
    .exhibit-card ul { margin-left: 18px; font-size: 0.94rem; }
    .exhibit-card li { margin-bottom: 7px; }
    .exhibit-card pre {
      font-family: "Courier New", monospace;
      font-size: 0.85rem;
      line-height: 1.48;
      background: radial-gradient(circle at bottom right, rgba(35, 22, 12, 0.3), transparent 55%), #efe4cc;
      border: 1.5px dashed #4a3319;
      padding: 14px 16px;
      white-space: pre-wrap;
      margin-top: 8px;
    }
    .ev-cut-line {
      border-top: 1.5px dashed #7d5b24;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      color: #6b4c1c;
      padding-top: 3px;
    }

    /* Ink-Friendly B&W Mode */
    .evidence-bw .ev-page {
      background: #fff;
      color: #111;
    }
    .bw-page-title { text-align: center; border-bottom: 2px solid #111; padding-bottom: 8px; }
    .bw-page-title .sub { font-family: -apple-system, sans-serif; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.14em; color: #444; }
    .bw-page-title h2 { font-size: 1.4rem; margin-top: 2px; border: none; padding: 0; }
    .exhibit-box { border: 2px solid #111; padding: 16px 18px; border-radius: 4px; flex: 1; }
    .exhibit-tag { font-family: -apple-system, sans-serif; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; background: #111; color: #fff; display: inline-block; padding: 3px 9px; margin-bottom: 8px; }
    .exhibit-box h3 { font-size: 1.2rem; border-bottom: 1px solid #999; padding-bottom: 6px; margin-bottom: 10px; }
    .exhibit-box ul { margin-left: 20px; font-size: 0.95rem; }
    .exhibit-box li { margin-bottom: 7px; }
    .exhibit-box pre { font-family: "Courier New", monospace; font-size: 0.86rem; background: #f6f6f6; border: 1px solid #bbb; padding: 12px 14px; white-space: pre-wrap; margin: 8px 0; }
    .bw-cut-line { border-top: 1.5px dashed #444; text-align: center; font-family: -apple-system, sans-serif; font-size: 0.7rem; letter-spacing: 0.1em; color: #555; padding-top: 4px; }

    /* =====================================================================
       PART 3: DYNAMIC HOST GUIDE
       ===================================================================== */
    .guide-doc {
      max-width: 8.5in;
      background: #fff;
      color: #181818;
      margin: 18px auto 36px;
      padding: 0.5in 0.55in;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      line-height: 1.44;
    }
    .doc-header {
      border-bottom: 3px double #111;
      padding-bottom: 10px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }
    .guide-doc .kicker {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #6b1d1d;
      font-weight: 700;
    }
    .doc-header h1 { font-size: 1.65rem; margin-top: 2px; }
    .case-pill {
      font-family: "Courier New", monospace;
      font-size: 0.9rem;
      font-weight: 700;
      border: 2px solid #111;
      padding: 4px 10px;
      background: #f5f5f5;
    }
    .spoiler-banner {
      border: 2px solid #7d1a1a;
      background: #fdf4f4;
      color: #5b1111;
      padding: 9px 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.82rem;
      margin-bottom: 16px;
    }
    .guide-doc h2 {
      font-size: 1.18rem;
      border-bottom: 1.5px solid #222;
      padding-bottom: 4px;
      margin: 18px 0 10px;
      page-break-after: avoid;
      break-after: avoid;
    }
    .guide-doc h3 {
      font-size: 0.98rem;
      margin: 12px 0 6px;
      color: #222;
      page-break-after: avoid;
      break-after: avoid;
    }
    .guide-doc p { font-size: 0.9rem; margin-bottom: 8px; }
    .guide-doc ul, .guide-doc ol { margin: 0 0 10px 20px; font-size: 0.89rem; }
    .guide-doc li { margin-bottom: 5px; }
    .role-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .role-box {
      border: 1.5px solid #222;
      padding: 8px 10px;
      background: #fafafa;
      font-size: 0.86rem;
    }
    .role-box.killer { border-color: #7d1a1a; background: #fdf4f4; }
    .role-box.inspector { border-style: double; border-width: 3px; }
    .role-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: #444;
      margin-bottom: 2px;
    }
    .guide-doc table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0 14px;
      font-size: 0.85rem;
    }
    .guide-doc th, .guide-doc td {
      border: 1px solid #999;
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
    }
    .guide-doc th {
      background: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .script-line {
      border-left: 3px solid #333;
      background: #f7f7f7;
      padding: 7px 11px;
      margin-bottom: 7px;
      font-size: 0.88rem;
      page-break-inside: avoid;
      break-inside: avoid;
    }
    .script-speaker {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #5b1111;
      margin-bottom: 2px;
    }
    .reveal-card {
      border: 2px solid #111;
      background: #faf8f3;
      padding: 14px 16px;
      margin-top: 10px;
      page-break-inside: avoid;
      break-inside: avoid;
    }
    .reveal-card h2 { border-bottom-color: #8a6830; color: #5b1111 !important; margin-top: 0; }
    .reveal-card span { color: #111 !important; }
    .page-break { page-break-before: always; break-before: page; }

    /* Print overrides */
    @media print {
      body { background: #fff; }
      .toolbar, .screen-divider { display: none !important; }
      .privacy-shield .spoiler-content { filter: none !important; }
      .sheet { width: auto; height: 10.1in; margin: 0; padding: 0; box-shadow: none; }
      .ev-page { width: auto; min-height: 10.1in; margin: 0; box-shadow: none; border: none; }
      .evidence-bw .ev-page { padding: 0; min-height: auto; }
      .guide-doc { max-width: none; margin: 0; padding: 0; box-shadow: none; }
    }
  </style>
</head>
<body class="privacy-shield" id="bodyEl">

  <div class="toolbar">
    <div>
      <h1>Complete Game Packet — Single PDF Generator</h1>
      <p>Evidence Packet (starts with spoiler-free Manor Map), Character Sheets &amp; Host Guide locked to one Case Code. Blurred on screen for blind printing—prints crystal-clear!</p>
    </div>
    <div class="controls">
      <label style="font-size:0.85rem;">Players:</label>
      <input type="range" id="countSlider" min="8" max="20" value="8" oninput="updateConfig()" />
      <strong id="countVal" style="color:#d4a853; font-size:1.1rem; min-width:24px;">8</strong>

      <label style="font-size:0.85rem; margin-left:4px;">Case:</label>
      <input type="text" id="caseCodeInput" class="code-input" value="" onchange="applyManualCode()" />
      <button class="btn" onclick="rollNewCase()" title="Picks any of the 20 balanced variations randomly (hidden in the code)">Roll Random Killer</button>

      <select id="evidenceStyle" class="select-input" onchange="render()">
        <option value="stylized">Evidence: Stylized Color</option>
        <option value="bw">Evidence: Ink-Friendly B&amp;W</option>
      </select>

      <label class="toggle-label" title="Uncheck if everyone is playing blind using the Companion App">
        <input type="checkbox" id="includeHostCheck" checked onchange="render()" />
        Include Host Guide
      </label>

      <button class="btn" id="blurBtn" onclick="toggleBlur()">Unblur Preview</button>
      <a class="btn" id="companionLink" href="../companion/index.html" target="_blank">Companion App</a>
      <button class="print-btn" onclick="window.print()">Print / Save Single PDF (<span id="totalPagesLabel">16+</span> Pages)</button>
    </div>
  </div>

  <div id="packetContainer"></div>

  <script>
    const E = window.RavenshollowEngine;
    const params = new URLSearchParams(window.location.search);
    let playerCount = parseInt(params.get("players") || localStorage.getItem("ravenshollow_players") || "8", 10);
    if (isNaN(playerCount) || playerCount < E.MIN_PLAYERS || playerCount > E.MAX_PLAYERS) playerCount = E.MIN_PLAYERS;
    let caseCode = params.get("case") || localStorage.getItem("ravenshollow_case_code") || E.CLASSIC_CODE;

    document.getElementById("countSlider").value = playerCount;
    document.getElementById("caseCodeInput").value = caseCode;

    function toggleBlur() {
      const b = document.getElementById("bodyEl");
      if (b.classList.contains("privacy-shield")) {
        if (!confirm("WARNING: Unblurring will reveal Character Roles, Exhibits, and the Host Guide solution on screen! Continue?")) return;
        b.classList.remove("privacy-shield");
        document.getElementById("blurBtn").textContent = "Blur (Spoiler-Free)";
      } else {
        b.classList.add("privacy-shield");
        document.getElementById("blurBtn").textContent = "Unblur Preview";
      }
    }

    function rollNewCase() {
      playerCount = parseInt(document.getElementById("countSlider").value, 10);
      caseCode = E.rollRandomCase(playerCount);
      document.getElementById("caseCodeInput").value = caseCode;
      render();
    }

    function applyManualCode() {
      const dec = E.decodeCaseCode(document.getElementById("caseCodeInput").value);
      caseCode = dec.code;
      document.getElementById("caseCodeInput").value = caseCode;
      render();
    }

    function updateConfig() {
      playerCount = parseInt(document.getElementById("countSlider").value, 10);
      render();
    }

    function renderCharacterSheets(sc) {
      return sc.characters
        .map(s => `
          <div class="sheet spoiler-content" data-id="${s.id}">
            <div>
              <div class="fold-role-wrapper">
                <div class="fold-role-box">
                  <div class="fold-role-text"><strong>CONFIDENTIAL ROLE:</strong> ${s.special || "You are Innocent. Share clues, question suspects, and vote to indict the Killer in the Final Verdict."}</div>
                  <div class="alignment-box">${s.badge}</div>
                </div>

    function renderHostGuide(sc) {
      const K = sc.killerBase;
      const A = sc.coreAccompliceBase;
      const I = sc.inspectorBase;
      const W = sc.witnessBase;
      const WS = sc.wineSpikerBase;
      const AW = sc.alibiWitnessBase;
      const accompliceList = sc.accomplices.map(id => {
        const c = E.BASE_CHARACTERS[id - 1];
        return `${c.name} (#${c.id}, ${c.initials})`;
      }).join(", ");

      const lookoutAcc = sc.accomplices[1] ? E.BASE_CHARACTERS[sc.accomplices[1] - 1] : null;
      const deflectionAcc = sc.accomplices[2] ? E.BASE_CHARACTERS[sc.accomplices[2] - 1] : null;

      const pillar4Text = sc.sameInitials
        ? `Exhibit C shows a charred 2008 audit log for <strong>${K.scandalTitle}</strong> signed <strong>"${K.initials}"</strong>—matching BOTH <strong>${K.name} (#${K.id})</strong> and <strong>${A.name} (#${A.id})</strong>. Exhibit E clears ${A.name} (no 2008 access to Archive Box #4) and directly ties ${K.name} (${K.ledger2008}) to the 2008 cover-up.`
        : `Exhibit C shows a charred 2008 audit log for <strong>${K.scandalTitle}</strong> flagging both <strong>"${sc.auditPair[0].initials}"</strong> and <strong>"${sc.auditPair[1].initials}"</strong> (roles &amp; dates burned). Exhibit E clears <strong>${A.name} (#${A.id})</strong> (no 2008 access to Archive Box #4) and directly ties <strong>${K.name} (#${K.id})</strong> (${K.ledger2008}) to the 2008 cover-up.`;

      const extraAccTimeline = (lookoutAcc
        ? `<li><strong>8:10–8:20 PM (Lookout):</strong> Shadow Team accomplice <strong>${lookoutAcc.name} (#${lookoutAcc.id})</strong> helped keep the upstairs gallery clear while ${K.name} rigged the Automaton.</li>`
        : "") + (deflectionAcc
        ? `<li><strong>Evening Deflection:</strong> Shadow Team accomplice <strong>${deflectionAcc.name} (#${deflectionAcc.id})</strong> agreed to steer suspicion toward the wine and away from Archive Box #4.</li>`
        : "");

      return `
        <div class="guide-doc spoiler-content">
          <div class="doc-header">
            <div>
              <div class="kicker">The Last Chime of Ravenshollow &bull; Human Host Manual</div>
              <h1>Dynamic Host Guide (${playerCount} Players)</h1>
            </div>
            <div class="case-pill">CASE ${sc.code}</div>
          </div>

          <div class="spoiler-banner">
            <strong>SPOILER WARNING:</strong> This Host Guide is dynamically generated for <strong>Case ${sc.code} (${playerCount} players)</strong>. Only a non-playing Human Host should read it. If everyone wants to play blind, uncheck "Include Host Guide" above and use the <strong>Companion Auto-Host App</strong> (<code>companion/index.html</code>) instead!
          </div>

          <h2>1. Active Cast &amp; Secret Roles (${playerCount} Active Guests)</h2>
          <div class="role-grid">
            <div class="role-box killer">
              <div class="role-label">Shadow Team — Killer</div>
              <strong>${K.name} (#${K.id})</strong> — Initials: <strong>${K.initials}</strong><br/>
              <span>2008 Scandal: ${K.scandalTitle}</span><br/>
              <span>Murder Weapon: ${sc.deliveryWithArticle} (laced with Aconite)</span>
            </div>
            <div class="role-box">
              <div class="role-label">Shadow Team — Accomplice${sc.accomplices.length > 1 ? "s" : ""} (${sc.accomplices.length})</div>
              <strong>${accompliceList}</strong><br/>
              <span>9:00 PM Breaker Accomplice: <strong>${A.name} (#${A.id})</strong></span>
            </div>
            <div class="role-box inspector">
              <div class="role-label">Innocent — Lead Forensic Witness</div>
              <strong>${I.name} (#${I.id})</strong><br/>
              <span>Brings the field chemistry kit (Exhibit F) &amp; leads Evidence Board briefings.</span>
            </div>
            <div class="role-box">
              <div class="role-label">Key Story Anchors (Innocent)</div>
              <strong>8:42 PM Witness:</strong> ${W.name} (#${W.id})<br/>
              <strong>Wine-Spiker Red Herring:</strong> ${WS.name} (#${WS.id})<br/>
              <strong>8:55 PM Alibi Witness:</strong> ${AW.name} (#${AW.id})
            </div>
          </div>

          <h2>2. The True Timeline (Case ${sc.code})</h2>
          <ul>
            <li><strong>2008 (The Motive):</strong> <strong>${K.name} (#${K.id})</strong> (${K.ledger2008}) was behind <em>"${K.scandalTitle}"</em> (${K.scandalDetail}). Arthur Vance buried the audit in <strong>Archive Box #4</strong>—until tonight's New Will ordered full public release.</li>
            <li><strong>2 Days Ago:</strong> Arthur recorded an angry memoir line onto a blank brass wax cylinder: <em>"You've gone too far! I'm calling the police as soon as the lines are back!"</em></li>
            <li><strong>7:58 PM (Red Herring):</strong> <strong>${WS.name} (#${WS.id})</strong> sneaks into the Dining &amp; Sideboard and slips non-lethal <strong>Chloral Hydrate (sleeping powder)</strong> into Arthur's 1998 Bordeaux decanter (before a poured glass is carried up to the Study), then slips into the Study around 8:05 PM to locate the New Will.</li>
            ${extraAccTimeline}
            <li><strong>8:15 PM (The Rigging):</strong> <strong>${K.name} (#${K.id})</strong> slips into the Study, swaps the Chronos Automaton's cylinder to play Arthur's angry recording at <strong>8:55 PM</strong>, and shifts the 5-lb brass counterweight to smash the water carafe at <strong>9:00 PM</strong>.</li>
            <li><strong>8:35 PM (The Blackmail):</strong> <strong>${K.name} (#${K.id})</strong> blackmails <strong>${A.name} (#${A.id})</strong> into cutting the basement Generator Room breaker for 15 seconds at <strong>9:00 PM sharp</strong>.</li>
            <li><strong>8:40 PM:</strong> A piping-hot single cup of chamomile tea is poured in Arthur's Study.</li>
            <li><strong>8:42 PM (The Poisoning):</strong> In the Grand Hall—witnessed by <strong>${W.name} (#${W.id})</strong>—<strong>${K.name} (#${K.id})</strong> hands Arthur <strong>${sc.deliveryWithArticle}</strong> laced with odorless, fast-acting <strong>concentrated Aconite</strong>.</li>
            <li><strong>8:45 PM:</strong> Arthur enters his Study alone, bolts the oak door from the inside, and uses the laced item. He never touches his tea or his wine.</li>
            <li><strong>8:48 PM (Actual Time of Death):</strong> Arthur suffers sudden cardiac arrest, collapses <strong>face-down</strong> onto his desk blotter, and smashes his gold pocket watch—freezing its hands at <strong>8:48 PM</strong>.</li>
            <li><strong>8:55 PM (The Alibi):</strong> The Automaton plays Arthur's recorded shout while <strong>${K.name} (#${K.id})</strong> stands right beside <strong>${AW.name} (#${AW.id})</strong> in the Grand Hall.</li>
            <li><strong>9:00 PM (The Power Cut):</strong> <strong>${A.name} (#${A.id})</strong> cuts the generator breaker for 15 seconds while the Automaton counterweight smashes the <strong>water carafe</strong>.</li>
            <li><strong>9:01 PM (The Cover-Up):</strong> Guests break down the bolted Study door. <strong>${K.name} (#${K.id})</strong> rushes to Arthur first, rolls him over, snaps the 8:48 PM pocket watch shut (claiming it <em>"always ran twelve minutes slow"</em>), and slips up by claiming to have seen Arthur's <em>"chalk-pale lips"</em> and smelled <em>"bitter almonds from the spilled wine."</em></li>
          </ul>

          <h2>3. The 4-Pillar Logical Deduction Proof</h2>
          <table>
            <thead>
              <tr><th style="width:24%;">Deduction Pillar</th><th>What Players Must Connect</th></tr>
            </thead>
            <tbody>
              <tr>
                <td><strong>1. Time of Death Was 8:48 PM</strong></td>
                <td>Arthur's watch froze at <strong>8:48 PM</strong> (Exhibit B). ${K.name}'s claim that it ran 12 minutes slow is disproved by Arthur's Horologist Journal (Exhibit E). The single cup of 8:40 PM tea sat untouched and barely lukewarm by 9:02 PM, and Exhibit D proves the Automaton faked both the 8:55 PM voice and 9:00 PM crash.</td>
              </tr>
              <tr>
                <td><strong>2. Odorless Aconite via ${K.deliveryItem}</strong></td>
                <td>${WS.name} (#${WS.id}) confesses to putting harmless Chloral Hydrate in the wine, which Arthur never drank (Exhibits D &amp; F). Exhibit F proves Arthur died of <strong>concentrated Aconite</strong> from ${sc.deliveryWithArticle}—which ${W.name} (#${W.id}) saw ${K.name} (#${K.id}) hand Arthur at 8:42 PM.</td>
              </tr>
              <tr>
                <td><strong>3. ${K.name}'s Fatal Act I Slip</strong></td>
                <td>In Act I (Opening Script &amp; Exhibit A), ${K.name} claimed to see Arthur's <em>"chalk-pale lips"</em> and smell <em>"bitter almonds from the spilled wine"</em> at 9:01 PM—contradicted in Act II by Exhibit D's Study Re-Inspection, which proves Arthur was <strong>face-down</strong> and the puddle was <strong>clear, odorless water</strong>!</td>
              </tr>
              <tr>
                <td><strong>4. Archive Box #4 (${sc.auditInitialsLabel})</strong></td>
                <td>${pillar4Text}</td>
              </tr>
            </tbody>
          </table>

          <div class="page-break"></div>

          <h2>4. Public Voting, Group Leader &amp; Detention Rules (Case ${sc.code})</h2>
          <ul>
            <li><strong>All Votes Are Public (No Host Needed):</strong> Every vote is conducted publicly among all players (show of hands or simultaneous pointing)—no private subgroup votes or eyes-closed Blackout phases.</li>
            <li><strong>Act I Town Hall Vote (3 min):</strong> 2 min rapid debate + 1 min public vote to <strong>Search &amp; Detain</strong> 1 suspect <em>and</em> elect <strong>1 Group Leader</strong>.</li>
            <li><strong>Group Leader Powers:</strong> The elected Group Leader (who may be Innocent or on the Shadow Team!) <strong>breaks all detention ties</strong> and immediately chooses <strong>1 additional player to Detain</strong> (or uses their extra detention in Act II).</li>
            <li><strong>Act II Town Hall Vote (3 min):</strong> Public vote to Detain 1 suspect (Group Leader breaks any tie).</li>
            <li><strong>Consequences of Detention:</strong> Detained players are <strong>not eliminated</strong>—they stay in the game, keep mingling, and complete all dialogues, but their <strong>Sealed Detention Card</strong> is immediately read aloud, and they skip their next Town Hall vote (everyone votes in the Final Verdict).</li>
            <li><strong>Win Conditions (Final Verdict — End of Act III):</strong> <strong>Innocent Guests Win</strong> if a plurality indicts <strong>${K.name} (#${K.id})</strong>. <strong>Shadow Team Wins</strong> if anyone else is indicted!</li>
          </ul>

          <h2>5. Round-by-Round Script (30–45 Min Pacing)</h2>
          <h3>Prologue — 9:00 PM (Read Aloud — 2 Min)</h3>
          <div style="margin-bottom:10px;">${sc.acts.prologue.html}</div>

          <h3>Act I — The Locked Study (Unveil Exhibits A &amp; B | 7m Mingle + 3m Public Vote &amp; Leader Election)</h3>
          <p style="font-style:italic; color:#444;">Have the listed characters read these lines aloud to open Act I:</p>
          ${sc.acts.act1.html}

          <h3>Act II — Shadows in the Clockwork (Unveil Exhibits C, D &amp; False Lead #1 | 6m Mingle + 3m Public Vote)</h3>
          <p style="font-style:italic; color:#444;">Have the listed characters read these lines aloud to open Act II:</p>
          ${sc.acts.act2.html}

          <h3>Act III — The Last Chime (Unveil Exhibits E, F &amp; False Lead #2 | 7m Mingle + 3m Final Verdict + 3m Reveal)</h3>
          <p style="font-style:italic; color:#444;">Have the listed characters read these lines aloud to open Act III:</p>
          ${sc.acts.act3.html}

          <h3>The Grand Reveal (Read After Tallying Final Verdict Ballots)</h3>
          <div class="reveal-card">${sc.revealHtml}</div>
        </div>
      `;
    }

    function render() {
      localStorage.setItem("ravenshollow_case_code", caseCode);
      localStorage.setItem("ravenshollow_players", String(playerCount));
      document.getElementById("countVal").textContent = playerCount;

      const q = `?case=${encodeURIComponent(caseCode)}&players=${playerCount}`;
      document.getElementById("companionLink").href = "../companion/index.html" + q;

      const evStyle = document.getElementById("evidenceStyle").value;
      const includeHost = document.getElementById("includeHostCheck").checked;
      const sc = E.buildScenario(caseCode, playerCount);

      const hostPagesEst = includeHost ? 3 : 0;
      const approxPages = playerCount + 5 + hostPagesEst;
      document.getElementById("totalPagesLabel").textContent = includeHost ? `${approxPages}+` : `${approxPages}`;

      const parts = [];
      parts.push(`
        <div class="screen-divider">
          <span>Part 1: Evidence Packet (Spoiler-Free Map + Exhibits A–F + False Leads) &bull; Case ${sc.code}</span>
          <span class="sub">5 Pages (${evStyle === "stylized" ? "Stylized Color" : "Ink-Friendly B&W"})</span>
        </div>
      `);
      parts.push(evStyle === "stylized" ? renderEvidenceStylized(sc) : renderEvidenceBW(sc));

      parts.push(`
        <div class="screen-divider">
          <span>Part 2: Character Sheets (${playerCount} Active Guests) &bull; Case ${sc.code}</span>
          <span class="sub">${playerCount} Pages</span>
        </div>
      `);
      parts.push(renderCharacterSheets(sc));

      if (includeHost) {
        parts.push(`
          <div class="screen-divider">
            <span>Part 3: Dynamic Host Guide &amp; Grand Reveal &bull; Case ${sc.code}</span>
            <span class="sub">~3 Pages</span>
          </div>
        `);
        parts.push(renderHostGuide(sc));
      }

      document.getElementById("packetContainer").innerHTML = parts.join("");
    }
