<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ink-Friendly Evidence Board — The Last Chime of Ravenshollow</title>
  <script src="../assets/variations-data.js"></script>
  <script src="../assets/mystery-engine.js?v=20261121"></script>
  <style>
    @page { size: letter portrait; margin: 0.45in; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Georgia, "Times New Roman", serif; color: #111; background: #eee; line-height: 1.45; }
    .toolbar {
      background: #141821; color: #f4ebd8; padding: 14px 24px;
      display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      position: sticky; top: 0; z-index: 100; border-bottom: 2px solid #d4a853;
    }
    .toolbar h1 { font-size: 1.02rem; color: #d4a853; }
    .toolbar p { font-size: 0.8rem; color: #b5bcc9; }
    .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .code-input {
      background: #0b0d12; color: #d4a853; border: 1.5px solid #d4a853;
      padding: 6px 10px; border-radius: 5px; font-family: "Courier New", monospace;
      font-weight: 700; width: 104px; text-align: center; font-size: 0.92rem;
    }
    .btn { background: #232a3a; color: #f4ebd8; border: 1px solid #3c465c; padding: 7px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.84rem; }
    .print-btn { background: #d4a853; color: #111; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.88rem; }
    .privacy-shield .secret-page { filter: blur(8px); user-select: none; }
    .page {
      width: 8.5in; min-height: 10in; background: #fff; margin: 20px auto; padding: 0.45in 0.55in;
      box-shadow: 0 4px 18px rgba(0,0,0,0.15); display: flex; flex-direction: column; gap: 16px;
      page-break-after: always; break-after: page;
    }
    .page:last-child { page-break-after: auto; break-after: auto; }
    .page-title { text-align: center; border-bottom: 2px solid #111; padding-bottom: 8px; }
    .page-title .sub { font-family: -apple-system, sans-serif; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.14em; color: #444; }
    .page-title h2 { font-size: 1.4rem; margin-top: 2px; }
    .exhibit-box { border: 2px solid #111; padding: 14px 18px; border-radius: 4px; flex: 1; }
    .exhibit-tag { font-family: -apple-system, sans-serif; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: #444; margin-bottom: 4px; }
    .exhibit-box h3 { font-size: 1.15rem; border-bottom: 1px solid #999; padding-bottom: 6px; margin-bottom: 10px; }
    .exhibit-box ul { margin-left: 20px; font-size: 0.92rem; }
    .exhibit-box li { margin-bottom: 6px; }
    .exhibit-box pre { font-family: "Courier New", monospace; font-size: 0.84rem; background: #f6f6f6; border: 1px solid #bbb; padding: 12px 14px; white-space: pre-wrap; margin: 8px 0; }
    .exhibit-box img.sketch-img { filter: grayscale(100%) contrast(115%); border-color: #111 !important; }
    .evidence-unit { display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .envelope-label {
      border: 2px solid #111; background: #f3f3f3; padding: 8px 14px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .envelope-label .env-main { font-size: 0.9rem; font-weight: 800; color: #111; letter-spacing: 0.04em; text-transform: uppercase; }
    .envelope-label .env-sub { font-size: 0.74rem; color: #444; font-weight: 600; }
    .cut-line { border-top: 1.5px dashed #444; text-align: center; font-family: -apple-system, sans-serif; font-size: 0.66rem; letter-spacing: 0.1em; color: #555; padding-top: 2px; }
    @media print {
      body { background: #fff; }
      .toolbar { display: none !important; }
      .privacy-shield .secret-page { filter: none !important; }
      .page { width: auto; min-height: auto; margin: 0; padding: 0; box-shadow: none; }
    }
  </style>
</head>
<body class="privacy-shield" id="bodyEl">
  <div class="toolbar">
    <div>
      <h1>Ink-Friendly B&amp;W Evidence Board — Synced to Case Code</h1>
      <p>Map is visible; Evidence pages are blurred on screen so you can print blind! (Prints crystal-clear.)</p>
    </div>
    <div class="controls">
      <label style="font-size:0.85rem;">Case:</label>
      <input type="text" id="caseCodeInput" class="code-input" onchange="applyCode()" />
      <button class="btn" id="blurBtn" onclick="toggleBlur()">Unblur Evidence</button>
      <button class="print-btn" onclick="window.print()">Print B&amp;W Evidence (7 Pages)</button>
    </div>
  </div>
  <div id="pagesContainer"></div>

  <script>
    const E = window.RavenshollowEngine;
    const params = new URLSearchParams(window.location.search);
    const playerCount = parseInt(params.get("players") || localStorage.getItem("ravenshollow_players") || "8", 10);
    let caseCode = params.get("case") || localStorage.getItem("ravenshollow_case_code") || E.CLASSIC_CODE;
    document.getElementById("caseCodeInput").value = caseCode;

    function toggleBlur() {
      const b = document.getElementById("bodyEl");
      b.classList.toggle("privacy-shield");
      document.getElementById("blurBtn").textContent = b.classList.contains("privacy-shield") ? "Unblur Evidence" : "Blur (Spoiler-Free)";
    }
    function applyCode() {
      const dec = E.decodeCaseCode(document.getElementById("caseCodeInput").value);
      caseCode = dec.code;
      document.getElementById("caseCodeInput").value = caseCode;
      localStorage.setItem("ravenshollow_case_code", caseCode);
      render();
    }
    function renderUnit(ex, code) {
      const envText = ex.presenter
        ? `REVEAL IN: ${ex.actLabel} &bull; INTRODUCED BY: ${ex.presenterLabel}`
        : `PRESENTED BY: ${ex.actLabel}`;
      const cardKicker = ex.presenter
        ? `${ex.actLabel} &bull; Introduced by ${ex.presenterLabel}`
        : ex.actLabel;
      return `
        <div class="evidence-unit">
          <div class="envelope-label">
            <div class="env-main">${envText}</div>
            <div class="env-sub">Envelope Label &bull; Case ${code}</div>
          </div>
          <div class="cut-line">&#9986; CUT ABOVE FOR OUTSIDE OF ENVELOPE &bull; PUT CARD BELOW INSIDE ENVELOPE &#9986;</div>
          <div class="exhibit-box">
            <div class="exhibit-tag">${cardKicker}</div>
            <h3>${ex.title}</h3>
            ${ex.html}
          </div>
        </div>
      `;
    }
    function render() {
      const sc = E.buildScenario(caseCode, playerCount);
      const byId = id => sc.exhibits.find(x => x.id === id);
      document.getElementById("pagesContainer").innerHTML = `
        <div class="page">
          <div class="page-title"><div class="sub">Case ${sc.code} — Public Evidence Board</div><h2>Ravenshollow Manor Floorplan &amp; Timeline</h2></div>
          <div style="border:2px solid #111; padding:6px;"><img src="../assets/ravenshollow-manor-map.jpg" alt="Ravenshollow Manor Map" style="width:100%; height:auto; display:block; filter:grayscale(100%) contrast(115%);" /></div>
          <div class="exhibit-box" style="flex:0 0 auto;">
            <div class="exhibit-tag">Always Visible</div><h3>Known Sequence of Events</h3>
            <ul>
              <li><strong>8:45 PM:</strong> Lord Arthur Vance retires alone to his locked second-floor Study, bolting the oak door from the <strong>inside</strong>.</li>
              <li><strong>8:55 PM:</strong> Guests hear Arthur shouting from upstairs: <em>"You've gone too far! I'm calling the police as soon as the lines are back!"</em></li>
              <li><strong>9:00 PM:</strong> Generator dies for 15 seconds; sharp crack &amp; heavy thud echo from the Study.</li>
              <li><strong>9:01 PM:</strong> Lights return; guests break down the bolted door and find Arthur Vance <strong>dead at his desk</strong>.</li>
            </ul>
          </div>
        </div>
        <div class="page secret-page">
          <div class="page-title"><div class="sub">Case ${sc.code} — Act I</div><h2>Act I Evidence — The Locked Study</h2></div>
          ${renderUnit(byId("A"), sc.code)}
        </div>
        <div class="page secret-page">
          <div class="page-title"><div class="sub">Case ${sc.code} — Act I</div><h2>Act I Evidence — The Locked Study (Continued)</h2></div>
          ${renderUnit(byId("B"), sc.code)}
        </div>
        <div class="page secret-page">
          <div class="page-title"><div class="sub">Case ${sc.code} — Act II</div><h2>Act II Evidence — Shadows in the Clockwork</h2></div>
          ${renderUnit(byId("C"), sc.code)}
          <div class="cut-line">&#9986; SEPARATE EVIDENCE ITEMS &#9986;</div>
          ${renderUnit(byId("D"), sc.code)}
        </div>
        <div class="page secret-page">
          <div class="page-title"><div class="sub">Case ${sc.code} — Act II</div><h2>Act II Evidence — Shadows in the Clockwork (Continued)</h2></div>
          ${renderUnit(byId("FL1"), sc.code)}
        </div>
        <div class="page secret-page">
          <div class="page-title"><div class="sub">Case ${sc.code} — Act III</div><h2>Act III Evidence — The Last Chime</h2></div>
          ${renderUnit(byId("E"), sc.code)}
          <div class="cut-line">&#9986; SEPARATE EVIDENCE ITEMS &#9986;</div>
          ${renderUnit(byId("F"), sc.code)}
        </div>
        <div class="page secret-page">
          <div class="page-title"><div class="sub">Case ${sc.code} — Act III</div><h2>Act III Evidence — The Last Chime (Continued)</h2></div>
          ${renderUnit(byId("FL2"), sc.code)}
        </div>`;
    }
    render();
  </script>
</body>
</html>
